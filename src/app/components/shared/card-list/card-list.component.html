<div class="cards-container">
  <div class="search-bar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search Pokemon</mat-label>
      <input 
        matInput 
        [ngModel]="searchQuery()" 
        (ngModelChange)="onSearch($event)" 
        [matAutocomplete]="auto"
        placeholder="Enter name..."
      >
      <mat-icon matSuffix>search</mat-icon>
      <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onSearch($event.option.value)">
        @for (name of filteredNames(); track name) {
          <mat-option [value]="name">{{ name }}</mat-option>
        }
      </mat-autocomplete>
    </mat-form-field>
  </div>
  <div class="cards-box" role="list">
    @for (card of cards(); track card.id) {
    <mat-card class="card" [routerLink]="card.routerLink" role="listitem" [attr.aria-label]="'Pokemon details: ' + card.name">
      <mat-card-header>
        <mat-card-title class="title-card">{{ card.name }}</mat-card-title>
      </mat-card-header>
      <div class="image-container">
        <div class="card-placeholder">
          <img 
            appImgLoader
            class="fade-in"
            [src]="card.imageUrl || 'assets/images/card-back.png'" 
            [alt]="card.name" 
          />
        </div>
      </div>
    </mat-card>
    }
  </div>
  <app-action-bar
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [totalItems]="totalItems()"
    (pageChange)="onPageChange($event)"
  ></app-action-bar>
</div>

<div class="loading-cards" data-cy="spinner" role="status" [attr.aria-busy]="showSpinner()">
  @if (showSpinner()) {
  <mat-spinner aria-label="Loading pokemon cards"></mat-spinner>
  }
</div>

@if (errorMessage()) {
<div class="error-overlay" role="alertDialog" aria-modal="true">
  <div class="error-box">
    <p>{{ errorMessage() }}</p>
    <div class="container-buttons">
      @if (showSourceChangeButton()) {
      <button mat-raised-button color="accent" (click)="onChangeSource()">
        Change data source
      </button>
      }
      <button mat-raised-button color="primary" (click)="onReload()">
        Reload cards
      </button>
    </div>
  </div>
</div>
}
