<div class="cards-container">
  <div class="search-bar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search Pokemon</mat-label>
      <input 
        matInput 
        [ngModel]="searchQuery()" 
        (ngModelChange)="onSearch($event)" 
        [matAutocomplete]="auto"
        placeholder="Enter name..."
      >
      <mat-icon matSuffix>search</mat-icon>
      <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onSearch($event.option.value)">
        @for (name of filteredNames(); track name) {
          <mat-option [value]="name">{{ name }}</mat-option>
        }
      </mat-autocomplete>
    </mat-form-field>
  </div>
  <div class="cards-box">
    @for (card of cards(); track card.id) {
    <mat-card class="card" [routerLink]="card.routerLink">
      <mat-card-header>
        <mat-card-title class="title-card">{{ card.name }}</mat-card-title>
      </mat-card-header>
      <div class="image-container">
        <img [src]="card.imageUrl || 'assets/images/card-back.png'" [alt]="card.name" (error)="$any($event.target).src = 'assets/images/card-back.png'" />
      </div>
    </mat-card>
    }
  </div>
  <app-action-bar
    [pageIndex]="pageIndex()"
    [pageSize]="pageSize()"
    [totalItems]="totalItems()"
    (pageChange)="onPageChange($event)"
  ></app-action-bar>
</div>

<div class="loading-cards" data-cy="spinner">
  @if (showSpinner()) {
  <mat-spinner></mat-spinner>
  }
</div>

@if (errorMessage()) {
<div class="error-overlay">
  <div class="error-box">
    <p>{{ errorMessage() }}</p>
    <div class="container-buttons">
      @if (showSourceChangeButton()) {
      <button mat-raised-button color="accent" (click)="onChangeSource()">
        Zmień źródło kart
      </button>
      }
      <button mat-raised-button color="primary" (click)="onReload()">
        Wczytaj karty ponownie
      </button>
    </div>
  </div>
</div>
}
