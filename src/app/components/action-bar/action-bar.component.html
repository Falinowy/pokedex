  <div class="pagination">
  <button class="btn btn-green" (click)="prevPage()" [disabled]="isPageIndexZero()">
    <span class="arrow">←</span> <span class="btn-text">Poprzednie</span>
  </button>

  <span class="pageInfo">Strona {{ getPageNumber() }}</span>

  <button
    class="btn btn-blue"
    (click)="nextPage()"
    [disabled]="isDisabledNext()"
  >
    <span class="btn-text">Następne</span> <span class="arrow">→</span>
  </button>
</div>
