<body>
  <mat-card
    class="card"
    *ngFor="let card of cards"
    routerLink="/cards/{{ card.id }}/{{ card.types }}"
  >
    <mat-card-header>
      <mat-card-title class="title-card">{{ card.name }}</mat-card-title>
    </mat-card-header>
    <img mat-card-image src="{{ card.images.small }}" />
  </mat-card>

<div class="cards-container">
  <div class="cards-box">
    <mat-card class="card" *ngFor="let cardFromTcgdex of showCardsFromTcgdex">
      <mat-card-header>
        <mat-card-title class="title-card">{{
          cardFromTcgdex.name
        }}</mat-card-title>
      </mat-card-header>
      @if(cardFromTcgdex.image) {
      <img mat-card-image src="{{ cardFromTcgdex.image }}" />
      }
    </mat-card>
  </div>
  <div class="pagination">
  <button (click)="prevPage()" [disabled]="pageIndex === 0">
    ← Poprzednie
  </button>

  <span class="pageInfo">Strona {{ pageIndex + 1 }}</span>

  <button
    (click)="nextPage()"
    [disabled]="(pageIndex + 1) * pageSize >= totalCards"
  >
    Następne →
  </button>
</div>
</div>
  <div class="loading-cards" data-cy="spinner">
    <mat-spinner *ngIf="showSpinner"></mat-spinner>
  </div>
  @if (errorMessage) {
  <div class="error-overlay">
    <div class="error-box">
      <p>{{ errorMessage }}</p>
      <button mat-raised-button color="primary" (click)="getCards()">
        Load Cards
      </button>
    </div>
  </div>
  }
</body>
